<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f5fbf">
<title>Bowling Score Sheet</title>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--muted:#6b6b70;--line:#d6d4cf;
  --accent:#1f5fbf;--accent-ink:#fff;--hi:#fff6d6;--bad:#c62828;--ok:#2e7d32;--cell:#f3f3f1;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa2;--line:#3a3a40;
  --accent:#5b9bff;--accent-ink:#0b1020;--hi:#3a3420;--bad:#ff6b6b;--ok:#6fcf73;--cell:#28282d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px 10px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
details>summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:var(--muted)}
details[open]>summary::after{content:"▴"}
#metaLine{color:var(--muted);font-weight:400;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:7px 0}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* bowler cards */
.bw{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.bw-h{display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--cell);border-bottom:1px solid var(--line)}
.bw-h input{border:none;background:transparent;padding:4px}
.bw-h .nm{flex:1;font-weight:700}
.bw-h .hd{width:44px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--card)}
.hdl{font-size:11px;color:var(--muted)}
.tot{font-weight:800;font-size:17px;min-width:38px;text-align:right}
.toth{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.del{border:none;background:transparent;color:var(--muted);font-size:20px;padding:0 4px}
.frames{display:grid;grid-template-columns:repeat(9,1fr) 1.4fr}
.frame{border-left:1px solid var(--line);min-width:0}
.frame:first-child{border-left:none}
.fn{font-size:10px;color:var(--muted);text-align:center;line-height:14px;border-bottom:1px solid var(--line)}
.balls{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tenth .balls{grid-template-columns:1fr 1fr 1fr}
.ball{height:34px;padding:0;border:none;border-left:1px solid var(--line);border-radius:0;background:var(--card);font-weight:700;font-size:16px;min-width:0}
.ball:first-child{border-left:none}
.ball:disabled{background:var(--cell);opacity:.5;cursor:default}
.ball:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--hi)}
.ball.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.cum{height:24px;line-height:24px;font-weight:600;text-align:center;font-size:14px}
@media (max-width:640px){
  .frames{grid-template-columns:repeat(5,1fr)}
  .frame:nth-child(6){border-left:none}
  .frame:nth-child(-n+5){border-bottom:1px solid var(--line)}
  .tenth .ball{font-size:14px}
}
.brand{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 12px 12px;margin-bottom:10px;text-align:center}
.brand img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 10px}
.welcome{margin:0;font-size:17px;font-weight:700;color:#3f6fc4;line-height:1.3}
.sub{margin:4px 0 0;font-size:14px;color:#6b6b70}
.addPanel{margin-top:10px;text-align:left}
.addPanel label{font-size:13px;color:#555;margin-bottom:4px}
.addPanel textarea{width:100%;font:inherit;font-size:16px;color:#1d1d1f;background:#fafafa;border:1px solid #ccc;border-radius:8px;padding:8px;resize:vertical}
.addBtns{display:flex;gap:8px;margin-top:8px}
.addBtns button{flex:1;padding:10px}
.add{width:100%;margin-top:10px;border-style:dashed;color:var(--muted)}
.add.primary{border-style:solid;color:var(--accent-ink);padding:12px}
table.sum{border-collapse:collapse;width:100%;font-size:14px}
.sum th,.sum td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
.sum th{font-size:11px;color:var(--muted);font-weight:600}
.sum th:first-child,.sum td:first-child{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.keypad{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:360px;margin:6px auto 0}
.keypad button{padding:0;height:32px;font-weight:700;font-size:14px;border-radius:6px}
.keypad .mk{background:var(--cell)}
.hint{font-size:12px;color:var(--muted);margin:4px 2px 0}
#status{font-size:13px;margin-top:6px}
#status.ok{color:var(--ok)}#status.err{color:var(--bad)}
.wrap{max-width:900px;margin:0 auto}
.print-only{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  .no-print,.keypad,.tabs,.del{display:none!important}
  .card{border:none;padding:0}
  .print-only{display:block}
  .frames{grid-template-columns:repeat(9,1fr) 1.4fr!important}
  .game-block{page-break-inside:avoid;margin-bottom:14px}
}
</style>
</head>

<script>
(function(){
const $ = id => document.getElementById(id);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const emptyGame = () => Array.from({length:10},(_,i)=>i<9?['','']:['','','']);
const newBowler = () => ({name:'',hdcp:0,games:[]});

let S = store.get('bss_state') || {meta:{center:'Fishers Island Community Center',event:'',date:today(),lane:'',games:3},bowlers:[]};
// show only bowlers actually added: drop empty placeholder rows (no name, no scores)
const isBlank=b=>!String(b.name||'').trim() && !(b.games||[]).some(g=>g.some(fr=>fr.some(c=>c!=='')));
S.bowlers=S.bowlers.filter(b=>!isBlank(b));
let cur = 0;           // current game tab
let focused = null;    // last focused ball button

function ensureGames(){ S.bowlers.forEach(b=>{ while(b.games.length<S.meta.games) b.games.push(emptyGame()); }); }
function save(){ store.set('bss_state',S); }

/* ---------- scoring ---------- */
function val(fr,k){
  const c=fr[k];
  if(c==='X') return 10;
  if(c==='/') return 10-val(fr,k-1);
  if(c==='-'||c==='F') return 0;
  if(c==='') return null;
  return +c;
}
function canEnter(f,k,fr){
  if(k===0) return true;
  if(f<9) return k===1 && fr[0]!=='' && fr[0]!=='X';
  if(k===1) return fr[0]!=='';
  return fr[1]!=='' && (fr[0]==='X'||fr[1]==='/');
}
function freshRack(f,k,fr){
  if(k===0) return true;
  if(f===9 && k===1) return fr[0]==='X';
  if(f===9 && k===2) return fr[1]==='X'||fr[1]==='/';
  return false;
}
// returns normalized char or null if invalid
function normalize(f,k,fr,ch){
  ch=ch.toUpperCase();
  if(ch==='0') ch='-';
  if(freshRack(f,k,fr)){
    if(ch==='X'||ch==='-'||ch==='F'||/^[1-9]$/.test(ch)) return ch;
    return null;
  }
  const standing=10-val(fr,k-1);
  if(ch==='/'||ch==='X') return '/';
  if(ch==='-'||ch==='F') return ch;
  if(/^[1-9]$/.test(ch)){ const n=+ch; if(n<standing) return ch; if(n===standing) return '/'; }
  return null;
}
function frameScores(game){
  const rolls=[];
  game.forEach((fr,f)=>{
    if(f<9){ if(fr[0]==='X') rolls.push(10); else for(let k=0;k<2;k++){const v=val(fr,k); if(v!==null) rolls.push(v);} }
    else for(let k=0;k<3;k++){const v=val(fr,k); if(v!==null) rolls.push(v);}
  });
  const out=[]; let i=0, total=0;
  for(let f=0;f<10;f++){
    const fr=game[f]; let s=null;
    if(f<9){
      if(fr[0]==='X'){ if(rolls[i+1]!==undefined&&rolls[i+2]!==undefined) s=10+rolls[i+1]+rolls[i+2]; i+=1; }
      else if(fr[1]==='/'){ if(rolls[i+2]!==undefined) s=10+rolls[i+2]; i+=2; }
      else if(fr[0]!==''&&fr[1]!==''){ s=rolls[i]+rolls[i+1]; i+=2; }
      else { i+=fr[0]!==''?1:0; }
    } else {
      const bonus = fr[0]==='X'||fr[1]==='/';
      if(bonus? fr[2]!=='' : fr[1]!=='') s=(val(fr,0)||0)+(val(fr,1)||0)+(bonus?(val(fr,2)||0):0);
    }
    if(s===null){ for(;f<10;f++) out.push(null); break; }
    total+=s; out.push(total);
  }
  // running total for partial games (for display of "so far")
  return out;
}
function gameTotal(game){ const fs=frameScores(game); let t=0; fs.forEach(v=>{if(v!==null)t=v;}); return t; }
function gameStarted(game){ return game.some(fr=>fr.some(c=>c!=='')); }
function gameDone(game){ return frameScores(game)[9]!==null; }

/* ---------- rendering ---------- */
function renderTabs(){
  const t=$('tabs'); t.innerHTML='';
  for(let g=0;g<S.meta.games;g++){
    const b=document.createElement('button'); b.textContent='Game '+(g+1);
    if(g===cur) b.className='on';
    b.onclick=()=>{cur=g;renderAll();};
    t.appendChild(b);
  }
}
function sheetTable(g, forPrint){
  const box=document.createElement('div');
  S.bowlers.forEach((b,bi)=>{
    const card=document.createElement('div'); card.className='bw';
    let html=`<div class="bw-h"><input class="nm" data-name="${bi}" placeholder="Bowler ${bi+1}"><span class="hdl">Hdcp</span><input class="hd" data-hd="${bi}" inputmode="numeric"><span class="tot" data-tot="${bi}-${g}"></span><span class="toth" data-toth="${bi}-${g}"></span>`;
    if(!forPrint) html+=`<button class="del no-print" title="Remove bowler" data-del="${bi}">×</button>`;
    html+='</div><div class="frames">';
    for(let f=0;f<10;f++){
      html+=`<div class="frame${f===9?' tenth':''}"><div class="fn">${f+1}</div><div class="balls">`;
      for(let k=0;k<(f===9?3:2);k++) html+=`<button class="ball" data-b="${bi}" data-g="${g}" data-f="${f}" data-k="${k}"></button>`;
      html+=`</div><div class="cum" data-cum="${bi}-${g}-${f}"></div></div>`;
    }
    card.innerHTML=html+'</div>'; box.appendChild(card);
  });
  return box;
}
function renderAll(){
  ensureGames(); renderTabs();
  const box=$('sheets'); box.innerHTML='';
  for(let g=0;g<S.meta.games;g++){
    const wrap=document.createElement('div'); wrap.className='game-block';
    if(g!==cur) wrap.classList.add('print-only');
    const hd=document.createElement('h2'); hd.className='print-only'; hd.textContent='Game '+(g+1); wrap.appendChild(hd);
    wrap.appendChild(sheetTable(g, g!==cur));
    box.appendChild(wrap);
  }
  box.querySelectorAll('[data-name]').forEach(i=>{ i.value=S.bowlers[+i.dataset.name].name; i.oninput=()=>{S.bowlers[+i.dataset.name].name=i.value; syncNames(i); refresh();}; });
  box.querySelectorAll('[data-hd]').forEach(i=>{ i.value=S.bowlers[+i.dataset.hd].hdcp||''; i.oninput=()=>{S.bowlers[+i.dataset.hd].hdcp=parseInt(i.value)||0; syncNames(i); refresh();}; });
  box.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{ const bi=+btn.dataset.del; const b=S.bowlers[bi]; if(b.games.some(gameStarted) && !confirm('Remove '+(b.name||'this bowler')+' and their scores?')) return; S.bowlers.splice(bi,1); renderAll(); });
  box.querySelectorAll('.ball').forEach(btn=>{
    btn.onfocus=()=>{focused=btn;};
    btn.onkeydown=e=>{ if(e.ctrlKey||e.metaKey||e.altKey) return; const key=e.key;
      if(key==='Backspace'||key==='Delete'){e.preventDefault();backspace(btn);return;}
      if(key==='ArrowRight'){e.preventDefault();move(btn,1);return;}
      if(key==='ArrowLeft'){e.preventDefault();move(btn,-1);return;}
      if(key.length===1){e.preventDefault();enter(btn,key);} };
  });
  refresh();
}
function syncNames(src){
  // keep name/hdcp inputs in hidden print tables in sync
  document.querySelectorAll(src.dataset.name!==undefined?`[data-name="${src.dataset.name}"]`:`[data-hd="${src.dataset.hd}"]`).forEach(i=>{if(i!==src)i.value=src.value;});
}
function refresh(){
  document.querySelectorAll('.ball').forEach(btn=>{
    const {b,g,f,k}=btn.dataset; const fr=S.bowlers[b].games[g][f];
    btn.textContent=fr[k]; btn.disabled=!canEnter(+f,+k,fr);
  });
  S.bowlers.forEach((b,bi)=>{
    for(let g=0;g<S.meta.games;g++){
      const fs=frameScores(b.games[g]);
      fs.forEach((v,f)=>{const c=document.querySelector(`[data-cum="${bi}-${g}-${f}"]`); if(c) c.textContent=v===null?'':v;});
      const t=gameTotal(b.games[g]); const st=gameStarted(b.games[g]);
      const a=document.querySelector(`[data-tot="${bi}-${g}"]`); if(a) a.textContent=st?t:'';
      const h=document.querySelector(`[data-toth="${bi}-${g}"]`); if(h) h.textContent=st&&b.hdcp?'('+(t+b.hdcp)+')':'';
    }
  });
  renderSummary(); save();
  const empty=!S.bowlers.length;
  $('tabs').style.display=empty?'none':'';
  $('keypad').style.display=empty?'none':'';
  $('sheetCard').style.display=empty?'none':'';
  $('addBowler').className='add no-print'+(empty?' primary':'');
  $('addBowler').textContent=empty?'+ Add Bowler or Bowlers to Begin Scoring':'+ Add Bowler or Bowlers';
  $('summary').closest('.card').style.display=empty?'none':'';
}
function renderSummary(){
  let h='<tr><th>Bowler</th>';
  for(let g=1;g<=S.meta.games;g++) h+=`<th>G${g}</th>`;
  h+='<th>Ser</th><th>+H</th><th>Avg</th></tr>';
  S.bowlers.forEach((b,bi)=>{
    const tots=b.games.slice(0,S.meta.games).map(g=>gameStarted(g)?gameTotal(g):null);
    const played=tots.filter(t=>t!==null); const ser=played.reduce((a,c)=>a+c,0);
    h+=`<tr><td>${esc(b.name||'Bowler '+(bi+1))}</td>`+tots.map(t=>`<td>${t===null?'':t}</td>`).join('')+
      `<td><b>${played.length?ser:''}</b></td><td>${played.length?ser+(b.hdcp||0)*played.length:''}</td><td>${played.length?Math.floor(ser/played.length):''}</td></tr>`;
  });
  $('summary').innerHTML=h;
  const m=S.meta; $('metaLine').textContent=[m.event,m.date,m.lane?'Lane '+m.lane:''].filter(Boolean).join(' · ');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- entry ---------- */
function frOf(btn){ const {b,g,f}=btn.dataset; return S.bowlers[b].games[g][f]; }
function flash(btn){ btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad'); }
function enter(btn,key){
  if(btn.disabled) return;
  const f=+btn.dataset.f,k=+btn.dataset.k,fr=frOf(btn);
  const ch=normalize(f,k,fr,key); if(!ch){flash(btn);return;}
  fr[k]=ch;
  // clear later balls in this frame that are no longer valid
  for(let j=k+1;j<fr.length;j++){ if(fr[j]===''||!canEnter(f,j,fr)||normalize(f,j,Object.assign([],fr,{[j]:''}),fr[j])!==fr[j]) fr[j]=''; }
  refresh(); move(btn,1);
}
function backspace(btn){
  const fr=frOf(btn),k=+btn.dataset.k;
  if(fr[k]!==''){ for(let j=k;j<fr.length;j++) fr[j]=''; refresh(); btn.focus(); }
  else move(btn,-1,true);
}
function move(btn,dir,clear){
  const all=[...btn.closest('.game-block').querySelectorAll(`.ball[data-b="${btn.dataset.b}"]`)];
  let i=all.indexOf(btn)+dir;
  while(i>=0&&i<all.length&&all[i].disabled) i+=dir;
  if(i>=0&&i<all.length){ all[i].focus(); if(clear){ const fr=frOf(all[i]); const k=+all[i].dataset.k; for(let j=k;j<fr.length;j++) fr[j]=''; refresh(); all[i].focus(); } }
}
const keys=['1','2','3','4','5','6','7','8','9','-','X','/','F','⌫','←','→'];
keys.forEach(k=>{ const b=document.createElement('button'); b.textContent=k; if('-X/F⌫←→'.includes(k)) b.className='mk'; b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>{ if(!focused||!document.body.contains(focused)) return;
    if(k==='⌫') backspace(focused); else if(k==='←') move(focused,-1); else if(k==='→') move(focused,1); else enter(focused,k); };
  $('keypad').appendChild(b); });

/* ---------- meta ---------- */
[['m-center','center'],['m-event','event'],['m-date','date'],['m-lane','lane']].forEach(([id,k])=>{ $(id).value=S.meta[k]||''; $(id).oninput=()=>{S.meta[k]=$(id).value;save();}; });
$('m-games').value=S.meta.games; $('m-games').onchange=()=>{S.meta.games=+$('m-games').value; if(cur>=S.meta.games)cur=0; renderAll();};
function openAdd(){ $('addPanel').hidden=false; $('addBowler').hidden=true; const t=$('addNames'); t.value=''; t.focus(); }
function closeAdd(){ $('addPanel').hidden=true; $('addBowler').hidden=false; }
$('addBowler').onclick=openAdd;
$('addCancel').onclick=closeAdd;
$('addGo').onclick=()=>{
  const entries=$('addNames').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
  if(!entries.length){ $('addNames').focus(); return; }
  S.bowlers=S.bowlers.filter(b=>!isBlank(b));
  const first=S.bowlers.length;
  entries.forEach(e=>{ const m=e.match(/^(.*?)\s+(\d{1,3})$/); S.bowlers.push({name:m?m[1].trim():e, hdcp:m?+m[2]:0, games:[]}); });
  closeAdd(); renderAll();
  const n=document.querySelector(`[data-name="${first}"]`); if(n) n.scrollIntoView({block:'start',behavior:'smooth'});
};
$('newSheet').onclick=()=>{ if(!confirm('Start a new blank sheet? Unsent scores on this sheet will be cleared.')) return;
  const keepNames=confirm('Keep the same bowlers and handicaps?');
  S={meta:{...S.meta,date:today()},bowlers:keepNames?S.bowlers.map(b=>({name:b.name,hdcp:b.hdcp,games:[]})):[]};
  cur=0; renderAll(); setStatus('');};
$('print').onclick=()=>window.print();

/* ---------- export ---------- */
function buildExport(){
  const n=S.meta.games;
  return {
    schema:'bowling-scoresheet/v1',
    center:S.meta.center, event:S.meta.event, date:S.meta.date, lane:S.meta.lane,
    gamesPerSeries:n, submittedAt:new Date().toISOString(),
    bowlers:S.bowlers.filter(b=>b.name.trim()||b.games.some(gameStarted)).map(b=>{
      const games=b.games.slice(0,n).map((g,i)=>({game:i+1, frames:g.map(fr=>fr.filter((c,k)=>c!==''||false)), frameScores:frameScores(g), scratch:gameTotal(g), withHandicap:gameTotal(g)+(b.hdcp||0), complete:gameDone(g), bowled:gameStarted(g)}));
      const played=games.filter(g=>g.bowled); const ser=played.reduce((a,g)=>a+g.scratch,0);
      return {name:b.name.trim(), handicap:b.hdcp||0, games, gamesBowled:played.length, series:ser, seriesWithHandicap:ser+(b.hdcp||0)*played.length, average:played.length?Math.floor(ser/played.length):null};
    })
  };
}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function baseName(){ return [S.meta.date||today(), slug(S.meta.event)||'scores', S.meta.lane?'lane-'+slug(S.meta.lane):''].filter(Boolean).join('_'); }
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
$('dlJson').onclick=()=>download(baseName()+'.json',JSON.stringify(buildExport(),null,2),'application/json');
$('dlCsv').onclick=()=>{ const d=buildExport(); const n=d.gamesPerSeries;
  const rows=[['date','center','event','lane','bowler','handicap',...Array.from({length:n},(_,i)=>'game'+(i+1)),'series','hdcp_series','average']];
  d.bowlers.forEach(b=>rows.push([d.date,d.center,d.event,d.lane,b.name,b.handicap,...b.games.map(g=>g.bowled?g.scratch:''),b.series,b.seriesWithHandicap,b.average??'']));
  download(baseName()+'.csv',rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n'),'text/csv'); };

function setStatus(msg,cls){ const s=$('status'); s.textContent=msg; s.className=cls||''; }

renderAll();
})();
</script>
</body>
